# Configuration BAD POSTURE (prototype PC). Les memes valeurs sont reprises
# dans firmware/main/config.h pour l'ESP32-S3.

pose:
  backend: yolo            # yolo (Ultralytics YOLO11n-pose, = modele ESP-DL) | mediapipe
  weights: yolo11n-pose.pt # telecharge automatiquement au premier lancement
  imgsz: 320               # 160 / 320 / 640 : plus petit = plus rapide (comme sur ESP32)
  conf_thr: 0.5            # confiance mini d'un keypoint

camera:
  index: 0
  source: "serial:COM3"    # "0" = webcam du PC ; "serial:COM3" = camera de la carte (sketch arduino/cam_serial)
  rotate: 270              # 0 / 90 / 180 / 270 (sens horaire) ; 270 = carte posee en portrait
  width: 640
  height: 480
  fps_limit: 5             # la posture change lentement : inutile d'aller plus vite

profiles:
  desk:
    alpha: 0.3
    enter_thr: 0.70
    exit_thr: 0.40
    trigger_s: 30
    exit_hold_s: 5
    beep_interval_s: 60
    sound: true
  practitioner:
    alpha: 0.2
    enter_thr: 0.75
    exit_thr: 0.45
    trigger_s: 120
    exit_hold_s: 5
    beep_interval_s: 120
    sound: false           # patient present : LED seule par defaut

# Seuils de la baseline par regles (ISO 11226 / EN 1005-4)
rules:
  neck_incl: [25, 10]
  neck_rel: [25, 10]
  trunk_incl: [20, 10]
  head_tilt: [10, 5]
  shoulder_tilt: [10, 5]

# Etalonnage personnel (touche c dans run.py / collect.py) : ecarts a la
# position de reference, en longueurs oreille-epaule. [seuil, echelle]
calibration:
  countdown_s: 3
  duration_s: 5
  min_frames: 8
  scale_min: 0.75          # echelle hors de cette plage (rapproche / eloigne) -> etalonnage perime
  scale_max: 1.33
  # trunk : tronc d'abord, la tete ne compte que si les epaules ont bouge
  #         (regarder vers le bas ou ecrire, epaules immobiles -> pas d'alerte)
  # all   : tous les ecarts comptent (plus sensible au regard)
  mode: trunk
  gate_sh_drop: 0.07       # epaule descendue de plus de ca -> la tete compte aussi
  gate_sh_fwd: 0.10
  # Une fois etalonne, le classifieur (MLP) n'est plus utilise : il a ete
  # entraine sur un autre placement de camera et reagit au regard.
  use_model_with_calib: false
  thresholds:
    sh_drop: [0.12, 0.07]  # tronc : epaule qui descend (dos qui s'affaisse)
    sh_fwd: [0.30, 0.10]   # tronc : epaule qui avance (penche en avant)
    d_neck: [12, 5]        # tete : deg d'inclinaison oreille-epaule en plus
    head_drop: [0.35, 0.15]
    head_fwd: [0.45, 0.15]
    neck_short: [0.15, 0.07] # oreille-epaule raccourcie (tete enfoncee, dos rond)
